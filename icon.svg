<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="20" fill="#1a1a2e"/>

  <!-- Attention matrix visualization (left side) -->
  <g transform="translate(80, 80)">
    <!-- Grid squares representing attention weights -->
    <rect x="0" y="0" width="50" height="50" rx="5" fill="#6366f1" opacity="0.9"/>
    <rect x="60" y="0" width="50" height="50" rx="5" fill="#6366f1" opacity="0.6"/>
    <rect x="120" y="0" width="50" height="50" rx="5" fill="#6366f1" opacity="0.3"/>

    <rect x="0" y="60" width="50" height="50" rx="5" fill="#6366f1" opacity="0.5"/>
    <rect x="60" y="60" width="50" height="50" rx="5" fill="#6366f1" opacity="0.9"/>
    <rect x="120" y="60" width="50" height="50" rx="5" fill="#6366f1" opacity="0.7"/>

    <rect x="0" y="120" width="50" height="50" rx="5" fill="#6366f1" opacity="0.2"/>
    <rect x="60" y="120" width="50" height="50" rx="5" fill="#6366f1" opacity="0.6"/>
    <rect x="120" y="120" width="50" height="50" rx="5" fill="#6366f1" opacity="0.9"/>

    <rect x="0" y="180" width="50" height="50" rx="5" fill="#6366f1" opacity="0.4"/>
    <rect x="60" y="180" width="50" height="50" rx="5" fill="#6366f1" opacity="0.3"/>
    <rect x="120" y="180" width="50" height="50" rx="5" fill="#6366f1" opacity="0.8"/>
  </g>

  <!-- Lightning bolt (optimization/speed) -->
  <g transform="translate(320, 100)">
    <polygon points="80,0 30,120 70,120 20,200 120,80 80,80 110,0" fill="url(#grad2)"/>
  </g>

  <!-- Speedometer/gauge arc -->
  <g transform="translate(520, 200)">
    <!-- Outer arc background -->
    <path d="M -100 0 A 100 100 0 0 1 100 0" fill="none" stroke="#333" stroke-width="20" stroke-linecap="round"/>
    <!-- Filled arc (performance indicator) -->
    <path d="M -100 0 A 100 100 0 0 1 70 -70" fill="none" stroke="url(#grad1)" stroke-width="20" stroke-linecap="round"/>
    <!-- Needle -->
    <line x1="0" y1="0" x2="50" y2="-50" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="12" fill="#fff"/>
    <!-- 2x label -->
    <text x="0" y="60" text-anchor="middle" fill="#10b981" font-family="Arial, sans-serif" font-size="36" font-weight="bold">2x</text>
  </g>

  <!-- Text -->
  <text x="400" y="360" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="28" font-weight="600">Attention Optimizer</text>
</svg>
